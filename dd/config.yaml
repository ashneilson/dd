name: SmartDoor MQTT Bridge
slug: dd
version: "0.4.0"
image: "ghcr.io/ashneilson/{arch}-addon-dd"
description: SmartDoor garage door integration with MQTT and position control, supporting multiple hubs
url: "https://github.com/ashneilson/dd"
startup: application
boot: auto
init: false
apparmor: true
services:
  - mqtt:need

arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386

map:
  - type: config
    read_only: false

options:
  hubs:
    - name: "Garage Door"
      host: ""
      code: ""
      password: ""
      mqtt_prefix: dd-door
  poll_interval: 60
  debug: false

schema:
  hubs:
    - name: str
      host: str
      code: str?
      password: password?
      mqtt_prefix: str
  poll_interval: int?
  debug: bool
