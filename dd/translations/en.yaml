configuration:
  hubs:
    name: "SmartDoor Hubs"
    description: "One entry per SmartDoor hub/garage door. Each hub needs its own host (local IP), a unique MQTT topic prefix, and — for the very first registration only — its own share code and your account password. Click 'Add another' to configure additional hubs."
  poll_interval:
    name: "Status Poll Interval (seconds)"
    description: "How often to poll each SmartDoor hub for actual door status updates (default: 60s)."
  debug:
    name: "Enable Debug Logging"
    description: "Set to true to print detailed verbose debug logs to the addon output console."
